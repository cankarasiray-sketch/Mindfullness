[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bilincli-kupon"
version = "1.0.0"
description = "iddaa için değer odaklı kupon önerisi ve kasa takibi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bilincli = "bilincli.cli:main"

[tool.setuptools.packages.find]
include = ["bilincli*"]

[tool.setuptools.package-data]
bilincli = ["ornek_ayar.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
