name: Android APK

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit count is the versionCode, so the full history is needed.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      # The release key lives only in GitHub Secrets (see README, "İmza anahtarı"). Without it no APK
      # is published, as one signed with another key could not update the installed app.
      - name: Restore signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::warning title=İmza anahtarı yok::SIGNING_KEYSTORE_BASE64 ve SIGNING_STORE_PASSWORD secret'ları tanımlı değil; APK derlenmedi ve yayımlanmadı."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$STORE_PASSWORD" -alias havauyari > /dev/null
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        if: steps.signing.outputs.available == 'true'
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: havauyari
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        if: steps.signing.outputs.available == 'true'
        id: apk
        run: |
          version="1.0.$(git rev-list --count HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "HavaUyari-$version.apk"

      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.available == 'true'
        with:
          name: HavaUyari-apk
          path: HavaUyari-*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name != 'pull_request' && steps.signing.outputs.available == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: Hava Uyarı ${{ steps.apk.outputs.version }}
          target_commitish: ${{ github.sha }}
          # Only the default branch produces the "Latest" release; other branches publish pre-releases.
          prerelease: ${{ github.ref_name != github.event.repository.default_branch }}
          make_latest: ${{ github.ref_name == github.event.repository.default_branch }}
          files: HavaUyari-*.apk
          body: |
            Telefona kurmak için aşağıdaki **HavaUyari-${{ steps.apk.outputs.version }}.apk** dosyasını indirip açın.
            İlk kurulumda "Bilinmeyen kaynaklardan uygulama yükleme" izni istenebilir.

            Dal: `${{ github.ref_name }}` · Commit: ${{ github.sha }}
