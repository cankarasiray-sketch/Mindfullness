name: Android APK

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit count is the versionCode, so the full history is needed.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        id: apk
        run: |
          version="1.0.$(git rev-list --count HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "HavaUyari-$version.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: HavaUyari-apk
          path: HavaUyari-*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: Hava Uyarı ${{ steps.apk.outputs.version }}
          target_commitish: ${{ github.sha }}
          # Only the default branch produces the "Latest" release; other branches publish pre-releases.
          prerelease: ${{ github.ref_name != github.event.repository.default_branch }}
          make_latest: ${{ github.ref_name == github.event.repository.default_branch }}
          files: HavaUyari-*.apk
          body: |
            Telefona kurmak için aşağıdaki **HavaUyari-${{ steps.apk.outputs.version }}.apk** dosyasını indirip açın.
            İlk kurulumda "Bilinmeyen kaynaklardan uygulama yükleme" izni istenebilir.

            Dal: `${{ github.ref_name }}` · Commit: ${{ github.sha }}
