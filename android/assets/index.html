<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bilinçli Kupon</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#14171c;--muted:#5d6672;--line:#e3e6eb;--accent:#0f6e56;
--accent-ink:#fff;--accent-soft:#e3f2ec;--bad:#b42318;--bad-soft:#fdecea;--warn:#8a5a00;--warn-soft:#fff4dc;
--chip:#eef1f4;--top:#0b3d31;--top-ink:#e9f5f0}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#171b21;--ink:#e8ebef;--muted:#9aa3ae;
--line:#2a3038;--accent:#4cc39a;--accent-ink:#06261d;--accent-soft:#16322a;--bad:#f2867c;--bad-soft:#3a1d1b;
--warn:#f0c065;--warn-soft:#33290f;--chip:#222831;--top:#0b3d31}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
input[type=checkbox]{accent-color:var(--accent)}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Roboto,"Segoe UI",sans-serif}
header{background:var(--top);color:var(--top-ink);padding:14px 16px 12px;position:sticky;top:0;z-index:5}
header .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:17px;margin:0;font-weight:650}
header .bal{font-size:12px;opacity:.8;text-align:right}
header .bal b{display:block;font-size:17px;opacity:1;font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;
background:#f0c065;color:#3a2a00;margin-left:6px;vertical-align:2px}
main{padding:12px 12px 96px;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);
display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:10px 0 12px;color:var(--muted);font:inherit;font-size:12px;
display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--accent);font-weight:650}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card h2{font-size:15px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 6px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile .k{font-size:11.5px;color:var(--muted)}.tile .v{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}.small{font-size:12.5px}.pos{color:var(--accent)}.neg{color:var(--bad)}
.kicker{font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--muted)}
.big{font-size:22px;font-weight:750;margin:2px 0 6px}
.leg{border-top:1px solid var(--line);padding:10px 0}
.leg:first-of-type{border-top:0}
.leg .top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.leg .teams{font-weight:600;margin:2px 0 6px}
.leg .pick{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--chip);font-weight:650;font-size:13px}
.chip.main{background:var(--accent-soft);color:var(--accent)}
.odds{font-size:18px;font-weight:750;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:650}
.pill.kazandi{background:var(--accent-soft);color:var(--accent)}
.pill.kaybetti{background:var(--bad-soft);color:var(--bad)}
.pill.iade,.pill.bek{background:var(--chip);color:var(--muted)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.sum div span{display:block;font-size:11.5px;color:var(--muted)}.sum div b{font-size:15px;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button.b{font:inherit;font-weight:600;padding:10px 16px;border-radius:10px;border:1px solid var(--accent);
background:var(--accent);color:var(--accent-ink);flex:1;min-width:120px}
button.b.ghost{background:transparent;color:var(--accent)}
button.b.warn{border-color:var(--bad);background:transparent;color:var(--bad)}
button.b:disabled{opacity:.5}
button.b.sm{padding:4px 12px;font-size:13px;border-radius:8px}
.banner{border-radius:12px;padding:12px;margin:10px 0;background:var(--warn-soft);color:var(--warn);font-size:13.5px}
.banner button{margin-top:8px}
label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
input,textarea,select{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
background:var(--bg);color:var(--ink)}
textarea{min-height:90px;font-size:12px;font-family:ui-monospace,monospace}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.check{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);color:var(--ink);margin:0;font-size:14px}
.check input{width:20px;height:20px;flex:none}
.list .item{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.list .item:first-child{border-top:0}
pre.out{white-space:pre-wrap;font-size:12px;background:var(--bg);border-radius:10px;padding:10px;margin:10px 0 0}
svg.chart{width:100%;height:auto;display:block}
#toast{position:fixed;left:12px;right:12px;bottom:80px;background:#1f2329;color:#fff;border-radius:12px;padding:12px 14px;
font-size:14px;opacity:0;transform:translateY(10px);transition:all .2s;z-index:20;pointer-events:none;white-space:pre-wrap}
#toast.show{opacity:1;transform:none}
#toast.err{background:#7a1d16}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:none;align-items:flex-end}
.sheet-bg.show{display:flex}
.sheet{background:var(--card);width:100%;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 6px;font-size:17px}
.busy{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:40;display:none;align-items:center;justify-content:center}
.busy.show{display:flex}
.spinner{width:42px;height:42px;border-radius:50%;border:4px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin 1s linear infinite}
.busy{flex-direction:column;gap:14px}.busy .progress{color:#fff;font-size:14px;max-width:80%;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.busy .elapsed{color:#fff;font-size:12px;opacity:.85;text-shadow:0 1px 2px rgba(0,0,0,.6)}.busy .b{background:#fff;display:none}.busy .b.on{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:26px 10px}
.verdict{border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13.5px}
.verdict.ok{background:var(--accent-soft);color:var(--accent)}
.verdict.no{background:var(--bad-soft);color:var(--bad)}
.verdict.old{background:var(--chip);color:var(--muted)}
.now{font-size:12.5px;margin-top:4px}
.st{display:inline-block;white-space:nowrap;padding:0 7px;border-radius:999px;font-size:11.5px;font-weight:650;background:var(--chip);color:var(--muted)}
.st.ok{background:var(--accent-soft);color:var(--accent)}.st.bad{background:var(--bad-soft);color:var(--bad)}
.fresh{font-size:12px;color:var(--muted);margin-top:2px}
.fresh.stale{color:var(--warn);font-weight:600}
.prof{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.prof.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.prof h4{margin:0 0 4px;font-size:15px}
.range{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.range div{background:var(--bg);border-radius:10px;padding:8px}.range span{display:block;font-size:11.5px;color:var(--muted)}
.range b{font-variant-numeric:tabular-nums}
.plan .prow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:9px 0;border-top:1px solid var(--line)}
.plan .muted+.prow{border-top:0}
.plan .amt .small{font-weight:500}
.plan .st{margin:2px 0}
.plan .amt{font-size:18px;font-weight:750;text-align:right;font-variant-numeric:tabular-nums}
.plan .tot{display:flex;justify-content:space-between;padding-top:10px;border-top:2px solid var(--line);margin-top:4px;font-weight:650}
.vrow{border-top:1px solid var(--line);padding:9px 0}.vrow:first-child{border-top:0}
.vrow .l1{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.vrow .l2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px}
.bars .bar{display:grid;grid-template-columns:96px 1fr 92px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:12.5px}
.bars .bar:first-child{border-top:0}
.bars .track{height:10px;background:var(--chip);border-radius:6px;position:relative;overflow:hidden}
.bars .fill{position:absolute;top:0;bottom:0;border-radius:6px}
.bars .fill.pos{background:var(--accent)}.bars .fill.neg{background:var(--bad)}
.bars .r{text-align:right;font-variant-numeric:tabular-nums}
details.info summary{cursor:pointer;font-weight:600}
nav button{font-size:11px}
.empty .big{font-size:20px}
p{margin:6px 0}
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>Bilinçli Kupon<span id="demoBadge"></span></h1>
    <div class="bal">Kasa<b id="hdrBal">-</b></div>
  </div>
</header>
<main id="view"></main>
<nav id="nav"></nav>
<div id="toast"></div>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="busy" id="busy"><div class="spinner"></div><div class="progress" id="progress"></div><div class="elapsed" id="busyTime"></div><button class="b ghost" id="busyHide" onclick="busyHide()">Arka planda sürsün</button></div>
<script>
"use strict";
// ---- köprü ----------------------------------------------------------------
var pending = {}, seq = 0, S = null, tab = "bugun", history_ = [], visibleActs = 0;
function bridge() { return window.Android || window.MockAndroid; }
/** Adil oran tablosu (promosyon kontrolü, kampanya hesaplayıcı): son taramanın, durumla birlikte gelir. */
function fairsTable() { return (S && S.radar && S.radar.fairs) || []; }
function act(action, payload, quiet) {
  return new Promise(function (resolve) {
    var id = "c" + (++seq);
    pending[id] = {resolve: resolve, visible: !quiet};
    if (!quiet) {
      visibleActs++;
      if (!document.getElementById("busy").classList.contains("show")) busy(true); // gizlenmiş olsa da yeniden göster
      document.getElementById("progress").textContent = visibleActs > 1 ? "Sırada: önceki işlem bitince başlayacak…" : "";
    }
    bridge().act(action, JSON.stringify(payload || {}), id);
  });
}
window.onActResult = function (id, res) {
  var r = pending[id]; delete pending[id];
  if (r && r.visible && visibleActs > 0) visibleActs--;
  if (!visibleActs) busy(false); // sıradaki görünür işlem sürüyorsa bekleme ekranı kalır
  if (res && res.message) toast(shortMessage(res.message), !res.ok);
  refresh();
  if (r) r.resolve(res);
};
window.refresh = function () {
  try { S = JSON.parse(bridge().state()); } catch (e) { toast("Durum okunamadı: " + e, true); return; }
  render();
};
window.goBack = function () {
  if (document.getElementById("sheetBg").classList.contains("show")) { closeSheet(); return true; }
  if (tab !== "bugun") { show("bugun"); return true; }
  return false;
};

// ---- biçimlendirme ----------------------------------------------------------
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c];
  });
}
function group(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
function tl(k) {
  if (k == null) return "-";
  var sign = k < 0 ? "-" : "", a = Math.abs(Math.round(k));
  return sign + group(Math.floor(a / 100)) + "," + String(a % 100).padStart(2, "0") + " TL";
}
function num(x, d) {
  var s = Math.abs(x).toFixed(d), parts = s.split(".");
  return (x < 0 ? "-" : "") + group(parts[0]) + (parts[1] ? "," + parts[1] : "");
}
function odds(x) { return num(x, 2); }
function pct(x, signed) {
  if (x == null) return "-";
  var sign = signed ? (x > 0 ? "+" : x < 0 ? "−" : "") : (x < 0 ? "−" : "");
  return sign + "%" + num(Math.abs(x) * 100, 1);
}
function trDate(iso) { return new Date(Date.parse(iso) + 3 * 3600 * 1000); }
function hm(iso) { var d = trDate(iso); return String(d.getUTCHours()).padStart(2, "0") + ":" + String(d.getUTCMinutes()).padStart(2, "0"); }
function dm(iso) { var d = trDate(iso); return String(d.getUTCDate()).padStart(2, "0") + "." + String(d.getUTCMonth() + 1).padStart(2, "0"); }
function dayLabel(day) { var p = day.split("-"); return p[2] + "." + p[1] + "." + p[0]; }
/** Karar özeti: istatistik satırı soluk; pas gününde "En yakın seçim" ayrı satırda. */
/** "… (adil 2,25, −%11,7)" satırındaki avantaj; okunamazsa null. */
function nearEv(line) {
  var m = /, ([−+-]?)%(\d+(?:,\d+)?)\)\s*$/.exec(line || "");
  if (!m) return null;
  var v = parseFloat(m[2].replace(",", ".")) / 100;
  return m[1] === "−" || m[1] === "-" ? -v : v;
}
/** Zirve Oran'da avantaja en yakın seçim (başlamamış maç); yoksa null. */
function zirveNear() {
  var Z = S.zirve;
  if (S.demo || !S.settings.zirve || !Z || !Z.nearest || Date.parse(Z.nearest.kickoff) <= Date.parse(S.now)) return null;
  return Z.nearest;
}
/**
 * Karar özeti. withZirve (pas kartı): Zirve Oran'daki en yakın seçim de karşılaştırılır; daha yakınsa
 * "En yakın seçim (Zirve Oran)" olarak öne geçer ve normal oranlardaki ikinci sıraya iner.
 */
function summaryHtml(summary, withZirve) {
  var lines = (summary || "").split("\n"), z = withZirve ? zirveNear() : null;
  var near = lines.filter(function (l) { return l.indexOf("En yakın seçim: ") === 0; })[0];
  var ne = near ? nearEv(near) : null, zFirst = !!z && (ne == null || z.ev > ne);
  var zHtml = z ? '<div class="zirve-pass"><p class="small"><b>En yakın seçim (Zirve Oran):</b> ' + esc(z.text) + "</p>"
    + '<p class="small near-stake"><b>Önerilen tutar:</b> ' + esc(z.stake) + "</p></div>" : "";
  var html = lines.map(function (line) {
    var isNear = line.indexOf("En yakın seçim: ") === 0, stake = line.indexOf("Önerilen tutar: ") === 0;
    if (isNear && zFirst) return zHtml + '<p class="small muted"><b>Normal oranlarda en yakın:</b> ' + esc(line.slice(16)) + "</p>";
    if (stake && zFirst) return '<p class="small muted">Önerilen tutar: ' + esc(line.slice(16)) + "</p>";
    return isNear ? '<p class="small"><b>En yakın seçim:</b> ' + esc(line.slice(16)) + "</p>"
      : stake ? '<p class="small near-stake"><b>Önerilen tutar:</b> ' + esc(line.slice(16)) + "</p>"
      : '<p class="small muted">' + esc(line) + "</p>";
  }).join("");
  if (z && !zFirst) {
    html += '<p class="small muted zirve-pass"><b>Zirve Oran\'da en yakın:</b> ' + esc(z.text) + " · Önerilen tutar: " + esc(z.stake) + "</p>";
  } else if (zFirst && !near) {
    html += zHtml;
  }
  return html;
}
function label(market, outcome) {
  if (market === "MS") return "MS " + outcome;
  if (market === "BS") return "Basket MS " + outcome;
  if (market.indexOf("BT@") === 0) return "Basket " + market.slice(3).replace(".", ",") + (outcome === "ALT" ? " Alt" : " Üst");
  if (market.indexOf("BH@") === 0) {
    var hl = parseFloat(market.slice(3)) * (outcome === "1" ? 1 : -1);
    return "Basket H. " + (outcome === "1" ? "Ev " : "Dep ") + (hl > 0 ? "+" : hl < 0 ? "−" : "") + String(Math.abs(hl)).replace(".", ",");
  }
  if (market === "AU25") return outcome === "ALT" ? "2,5 Alt" : "2,5 Üst";
  var ln = market.indexOf("@") > 0 ? market.slice(market.indexOf("@") + 1) : "", au = outcome === "ALT" ? " Alt" : " Üst";
  if (market.indexOf("AU@") === 0) return ln.replace(".", ",") + au;
  if (market.indexOf("EVG@") === 0) return "Ev " + ln.replace(".", ",") + au;
  if (market.indexOf("DEPG@") === 0) return "Dep " + ln.replace(".", ",") + au;
  if (market.indexOf("HMS@") === 0) { var hg = Math.round(Math.abs(parseFloat(ln))); return "H.MS " + (parseFloat(ln) >= 0 ? "(" + hg + ":0)" : "(0:" + hg + ")") + " " + outcome; }
  if (market === "KG") return outcome === "VAR" ? "KG Var" : "KG Yok";
  if (market === "CS") return "ÇŞ " + outcome.charAt(0) + "-" + outcome.charAt(1);
  return market + " " + outcome;
}
var RESULT = {kazandi: "Tuttu", kaybetti: "Yattı", iade: "İade"};
function pill(r) { return r ? '<span class="pill ' + esc(r) + '">' + RESULT[r] + "</span>" : '<span class="pill bek">Bekliyor</span>'; }
function cls(v) { return v > 0 ? "pos" : v < 0 ? "neg" : ""; }
function minsSince(iso) { return Math.max(0, Math.round((Date.parse(S.now) - Date.parse(iso)) / 60000)); }
function ago(iso) { var m = minsSince(iso); return m < 1 ? "az önce" : m < 60 ? m + " dk önce" : Math.floor(m / 60) + " sa " + (m % 60) + " dk önce"; }
function checkFresh(ch) { return !!ch && (Date.parse(S.now) - Date.parse(ch.at)) / 1000 <= S.freshSeconds; }
var STATUS = {ok: ["güncel, hâlâ avantajlı", "ok"], edge_lost: ["avantaj kayboldu", "bad"], started: ["başladı", "bad"],
  not_found: ["bültende yok", "bad"], no_fair: ["adil oran yok", "bad"], mbs: ["MBS değişti", "bad"]};

// ---- arayüz yardımcıları ------------------------------------------------------
var toastTimer;
/** Uzun sonuçlar (ör. kaynak testi) balonu kaplamasın: ilk satır, ayrıntı ekranda. */
function shortMessage(m) {
  if (m.length <= 280) return m;
  var lines = m.split("\n"), first = lines[0];
  if (first.indexOf(":") < 0 && lines.length > 1) first = lines[1].trim(); // başlık satırını ("ÖZET") atla
  return (first.length > 200 ? first.slice(0, 200) + "…" : first) + " (ayrıntı ekranda)";
}
function toast(msg, err) {
  var t = document.getElementById("toast");
  t.textContent = msg; t.className = "show" + (err ? " err" : "");
  t.onclick = function () { t.className = ""; }; // dokununca kapanır
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.className = ""; }, err ? 6000 : 3500);
}
/** Bekleme ekranı: geçen süre görünür; uzun işlemde ekran kapatılabilir, sonuç bitince gelir. */
var busyStart = 0, busyTimerId = null;
function busy(on) {
  document.getElementById("busy").className = "busy" + (on ? " show" : "");
  clearInterval(busyTimerId);
  busyTimerId = null;
  document.getElementById("busyTime").textContent = "";
  document.getElementById("busyHide").className = "b ghost";
  if (on) {
    busyStart = Date.now();
    busyTimerId = setInterval(busyClock, 1000);
  } else document.getElementById("progress").textContent = "";
}
function busyClock() {
  var s = Math.floor((Date.now() - busyStart) / 1000);
  document.getElementById("busyTime").textContent = s + " sn";
  if (s >= BUSY_HIDE_S) document.getElementById("busyHide").className = "b ghost on";
}
var BUSY_HIDE_S = 10;
function busyHide() {
  clearInterval(busyTimerId);
  busyTimerId = null;
  document.getElementById("busy").className = "busy";
  toast("İşlem arka planda sürüyor; bitince sonuç burada görünecek.");
}
window.onProgress = function (text) { var p = document.getElementById("progress"); if (p) p.textContent = text; };
function openSheet(html) {
  document.getElementById("sheet").innerHTML = html;
  document.getElementById("sheetBg").className = "sheet-bg show";
}
function closeSheet() { document.getElementById("sheetBg").className = "sheet-bg"; }
document.getElementById("sheetBg").addEventListener("click", function (e) { if (e.target.id === "sheetBg") closeSheet(); });
function val(id) { var el = document.getElementById(id); return el ? el.value.trim() : ""; }

var ICONS = {
  bugun: '<path d="M4 18h4v-4h4v-4h4V6h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
  gecmis: '<circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 8v4l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
  kasa: '<rect x="3" y="6" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 12.5h2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M6 6l8-3 2 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',

function legsHtml(c, interactive) {
  var ch = !c.played && !c.result && c.lastCheck ? c.lastCheck : null;
  return c.legs.map(function (l, i) {
    var ev = l.fairProb * l.odds - 1;
    var now = "";
    if (ch && ch.legs[i]) {
      var r = ch.legs[i], st = STATUS[r.status] || [r.status, ""];
      now = '<div class="now">' + (r.oddsNow ? "Şimdi <b>" + odds(r.oddsNow) + "</b> · adil " + odds(1 / r.fairNow) + ' · <span class="' + cls(r.evNow) + '">avantaj '
        + pct(r.evNow, true) + "</span> " : "") + '<span class="st ' + st[1] + '">' + esc(st[0]) + "</span></div>";
    }
    if (l.closingFair != null) {
      var clv = l.odds * l.closingFair - 1;
      now += '<div class="now muted">Kapanış: adil ' + odds(1 / l.closingFair) + ' · <span class="' + cls(clv) + '">CLV ' + pct(clv, true) + "</span></div>";
    }
    var manual = interactive && !l.result && Date.parse(l.kickoff) + 3 * 3600 * 1000 < Date.parse(S.now)
      ? ' <button class="b ghost" style="flex:none;min-width:0;padding:4px 10px;font-size:12px" onclick="manualSheet(' + c.id + "," + l.position + ')">Sonuç gir</button>' : "";
    return '<div class="leg"><div class="top"><span>' + esc(dm(l.kickoff)) + " · " + esc(hm(l.kickoff)) + (l.league ? " · " + esc(l.league) : "")
      + "</span><span>" + (l.bookCode ? "kod " + esc(l.bookCode) + " · " : "") + "MBS " + l.mbs + "</span></div>"
      + '<div class="teams">' + esc(l.home) + " – " + esc(l.away) + "</div>"
      + '<div class="pick"><span class="chip main">' + esc(label(l.market, l.outcome)) + '</span><span class="odds">' + odds(l.odds)
      + '</span><span class="small muted">adil ' + odds(1 / l.fairProb) + ' · <span class="' + cls(ev) + '">avantaj ' + pct(ev, true) + "</span></span>"
      + '<span style="margin-left:auto">' + (l.result ? pill(l.result) + (l.score ? ' <span class="small muted">' + esc(l.score) + "</span>" : "") : "") + manual + "</span></div>" + now + "</div>";
  }).join("");
}
function couponCard(c, title, extra) {
  var ev = c.winProb * c.totalOdds - 1, stake = c.played ? c.stake : (c.stakeNow != null ? c.stakeNow : c.suggestedStake);
  var status = c.result ? pill(c.result) : '<span class="pill bek">' + (c.played ? (c.autoPlayed ? "Oynandı (otomatik)" : "Oynandı") : c.superseded ? "Yenilendi (eski plan)" : "Öneri") + "</span>";
  var actions = "", panel = "", fresh = "";
  var first = Math.min.apply(null, c.legs.map(function (l) { return Date.parse(l.kickoff); }));
  var playable = !c.played && !c.result && first > Date.parse(S.now);
  if (playable) {
    var ch = c.lastCheck, isFresh = checkFresh(ch), stale = minsSince(c.createdAt) > 60;
    fresh = '<div class="fresh' + (stale && !isFresh ? " stale" : "") + '">Oranlar ' + esc(hm(c.createdAt)) + "'de alındı (" + esc(ago(c.createdAt)) + ")"
      + (stale && !isFresh ? " · oynamadan önce kontrol et" : "") + "</div>";
    if (ch) {
      var kind = !isFresh ? "old" : ch.playable ? "ok" : "no";
      panel = '<div class="verdict ' + kind + '"><b>' + (kind === "ok" ? "OYNANABİLİR" : kind === "no" ? "OYNAMA" : "KONTROL ESKİ")
        + "</b> · kontrol " + esc(hm(ch.at)) + " (" + esc(ago(ch.at)) + ")<br>" + esc(ch.verdict)
        + (kind === "old" ? "<br>Oranlar değişmiş olabilir; tekrar kontrol et." : "") + "</div>";
    }
    if (!S.demo) {
      var bily = '<button class="b ghost" onclick="act(\'openUrl\',{url:\'https://www.bilyoner.com/\'},true)">Bilyoner\'i aç</button>';
      var recheck = '<button class="b' + (isFresh ? " ghost" : "") + '" onclick="act(\'recheck\',{coupon:' + c.id + '})">'
        + (ch ? "Tekrar kontrol et" : "Oynamadan önce kontrol et") + "</button>";
      if (isFresh && ch.playable) {
        actions = '<div class="btns"><button class="b" onclick="playCheckedSheet(' + c.id + ')">Güncel oranlarla oynadım</button>' + recheck + "</div>";
      } else if (isFresh && !ch.playable) {
        actions = '<div class="btns"><button class="b" onclick="act(\'generate\',{force:true})">Güncel oranlarla yeni kupon</button>' + recheck + "</div>";
      } else {
        actions = '<div class="btns">' + recheck + '<button class="b ghost" onclick="playSheet(' + c.id + ')">Oynadım (oranları ben gireyim)</button></div>';
      }
      actions += '<div class="btns">' + bily + "</div>";
    }
  }
  return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div class="kicker">'
    + esc(title) + " · #" + c.id + "</div>" + status + "</div>" + fresh + legsHtml(c, !S.demo)
    + '<div class="sum"><div><span>Toplam oran</span><b>' + odds(c.totalOdds) + "</b></div><div><span>Tutma olasılığı</span><b>" + pct(c.winProb)
    + '</b></div><div><span>Beklenen değer</span><b class="' + cls(ev) + '">' + pct(ev, true) + "</b></div><div><span>"
    + (c.played ? "Oynanan" : "Önerilen") + "</span><b>" + (stake ? tl(stake) : "-") + "</b></div><div><span>Tutarsa</span><b>"
    + (stake ? tl(Math.round(stake * c.totalOdds)) : "-") + "</b></div><div><span>Sonuç</span><b>"
    + (c.result && c.played ? '<span class="' + cls((c.payout || 0) - c.stake) + '">' + tl((c.payout || 0) - c.stake) + "</span>" : "-")
    + "</b></div></div>" + panel + (extra || "") + actions
    + (!S.demo && c.played && !c.result ? '<div class="btns"><button class="b ghost" onclick="act(\'unplay\',{coupon:' + c.id + '})">Oynamadım, geri al</button></div>' : "")
    + "</div>";
}
function todayIds() {
  var run = S.todayRun;
  return run && run.couponIds && run.couponIds.length ? run.couponIds : run && run.couponId ? [run.couponId] : [];
}
function planCard() {
  var ids = todayIds();
  if (!ids.length || !S.todayRun || S.todayRun.decision !== "kupon") return "";
  var bank = S.stats.balance + S.stats.openStake, total = 0, rows = "";
  ids.forEach(function (id) {
    var c = couponById(id);
    if (!c) return;
    var ch = c.lastCheck, fresh = checkFresh(ch), started = Math.min.apply(null, c.legs.map(function (l) { return Date.parse(l.kickoff); })) <= Date.parse(S.now);
    var amount, state, odd = c.totalOdds;
    if (c.result) { amount = c.played ? c.stake : 0; state = pill(c.result); }
    else if (c.played) { amount = c.stake; state = '<span class="st ok">' + (c.autoPlayed ? "oynandı (otomatik)" : "oynandı") + "</span>"; }
    else if (fresh && !ch.playable) { amount = 0; state = '<span class="st bad">oynama</span>'; }
    else if (started) { amount = 0; state = '<span class="st">başladı</span>'; }
    else if (fresh && ch.playable) { amount = ch.stake; odd = ch.odds; state = '<span class="st ok">oyna · güncel</span>'; }
    else { amount = c.stakeNow != null ? c.stakeNow : c.suggestedStake; state = '<span class="st">oyna · kontrol et</span>'; }
    total += amount;
    rows += '<div class="prow"><div><b>#' + c.id + "</b> · " + c.legs.length + " maç · oran " + odds(odd) + "<div>" + state + "</div>"
      + '<div class="small muted">' + c.legs.map(function (l) { return esc(l.home) + " – " + esc(l.away) + " " + esc(label(l.market, l.outcome)); }).join("<br>")
      + '</div></div><div class="amt">' + (amount ? tl(amount) : "–") + '<div class="small muted">' + (amount ? pct(amount / bank) + " ana para<br>tutarsa " + tl(Math.round(amount * odd)) : "")
      + "</div></div></div>";
  });
  return '<div class="card plan"><div class="kicker">BUGÜNÜN OYUN PLANI · ANA PARA ' + tl(bank) + "</div>"
    + '<div class="small muted">Kasada ' + tl(S.stats.balance) + (S.stats.openStake ? " + oyunda " + tl(S.stats.openStake) : "") + "</div>" + rows
    + '<div class="tot"><span>Toplam bahis</span><span>' + tl(total) + " (" + pct(total / (bank || 1)) + ")</span></div>"
    + '<p class="small muted">Tutarlar Kelly\'ye göre güncel kasadan hesaplanır. ' + (S.settings.autoTrack
      ? "Otomatik takip açık: ilk maçtan 90 dk önceki kontrolde avantajlı kalan kupon güncel oranlarla oynanmış sayılır, sonuçla kasa kendiliğinden güncellenir."
      : "Elle takip: oynadığında \"Oynadım\"a bas; sonuçla kasa kendiliğinden güncellenir.") + "</p></div>";
}
function viewToday() {
  var html = banners() + planCard() + tiles(), run = S.todayRun;
  if (!run) {
    html += '<div class="card empty"><div class="kicker">BUGÜN</div><div class="big">Karar bekleniyor</div><p class="muted">Her sabah '
      + esc(hm(S.nextRun)) + "'da otomatik üretilir ve bildirim olarak gelir.</p>"
      + (S.demo ? "" : '<div class="btns"><button class="b" onclick="act(\'generate\',{force:false})">Şimdi üret</button></div>') + "</div>";
  } else if (run.decision === "kupon" && run.couponId) {
    var ids = run.couponIds && run.couponIds.length ? run.couponIds : [run.couponId];
    ids.forEach(function (id, i) {
      var c = couponById(id);
      if (!c) return;
      var title = ids.length > 1 ? "Günün kuponu " + (i + 1) + "/" + ids.length : "Günün kuponu";
      html += couponCard(c, title, i === ids.length - 1 ? (run.reason ? '<p class="small muted">' + esc(run.reason) + "</p>" : "")
        + summaryHtml(run.summary) : "");
    });
  } else {
    var pass = run.decision === "pas";
    if (pass) html += pickCard(); // pas gününde öneri önce: yapılacak iş üstte
    html += '<div class="card"><div class="kicker">' + (pass ? "BUGÜN" : "KORUMA DEVREDE") + '</div><div class="big">' + (pass ? "Pas" : "Kupon yok")
      + "</div><p>" + esc(run.reason) + "</p>" + summaryHtml(run.summary, pass)
      + (pass ? '<p class="small muted">Avantaj yokken oynamamak, kasayı koruyan en kârlı karardır.</p>' : "") + "</div>";
  }
  if (!run) html += pickCard(); // pas gününde yukarıda; koruma devredeyken (kayıp limiti) öneri yok
  if (!S.demo && S.zirve && S.zirve.play > 0) {
    html += '<div class="card" id="zirveHome"><div class="kicker">ZİRVE ORAN</div><p>' + S.zirve.play + " Zirve Oran seçimi adil oranı geçiyor.</p>"
      + '<div class="btns"><button class="b" onclick="show(\'firsat\')">Fırsatlar\'da gör</button></div></div>';
  }
  html += outlookCard();
  var ids = todayIds();
  S.coupons.forEach(function (c) {
    if (ids.indexOf(c.id) >= 0 || c.result) return;
    var first = Math.min.apply(null, c.legs.map(function (l) { return Date.parse(l.kickoff); }));
    if (c.played || (!c.superseded && first > Date.parse(S.now))) html += couponCard(c, "Açık kupon");
  });
  if (!S.demo) html += '<div class="btns"><button class="b ghost" onclick="settleNow()">Sonuç kontrolü</button>'
    + '<button class="b ghost" onclick="regenerate()">Güncel oranlarla yeni kupon</button></div>';
  return html;
}
/** Sonuç kontrolü (2.15.1): uzun yanıt (birden çok maç) bildirim şeridine sığmaz, sayfada gösterilir. */

// Değerli seçim olmayan günlerde de tek öneri: tek maç oynanabilen (MBS 1), sık tutan (en az %60), adil

function todayPick() {
  var today = new Date(Date.parse(S.now) + 3 * 3600000).toISOString().slice(0, 10); // Türkiye günü
  for (var i = 0; i < S.coupons.length; i++) {
    var c = S.coupons[i];
    if (c.pick && c.played && c.day === today) return c;
  }
  return null;
}
var pickRows = [];
function regPick(x) { pickRows.push(x); return pickRows.length - 1; }
/** Seçim satırı: oran (Zirve ise normal oran üstü çizili), model rozeti, MBS. */

/**

function promoEval(p, market, o) {

  var f = st.edgeGuard && seg && seg.factor != null ? seg.factor : 1;
  var q = f * p + (1 - f) / o, ev = q * o - 1, lowProb = p < (st.minLegProb || 0), play = ev >= st.minLegEv && o > 1 && !lowProb;
  var frac = play ? Math.min(st.kellyMultiplier * Math.max(0, ev / (o - 1)), st.maxStakeFraction) : 0;
  var stake = S.stats.balance > 0 ? Math.floor(S.stats.balance * frac / 1000) * 1000 : 0;

// Tek seçimli kampanyaların gerçek değeri, son taramanın adil oranlarıyla (kredi harcamaz).
var CAMP = {type: "freebet", amount: "100", pct: "25", cap: "", refund: "nakit", boost: "10", lead: "2", minOdds: "1,50", returnStake: false,
  sort: "value", combos: false, minProb: null};
/** Hesaplayıcının en az tutma olasılığı: yazılmadıysa ayardaki maç başına şart. */
function campMinProb() { return CAMP.minProb != null && String(CAMP.minProb).trim() !== "" ? numIn(CAMP.minProb, 0) / 100 : (S.settings.minLegProb || 0); }
var CAMP_TYPES = [["freebet", "Bedava bahis"], ["cashback", "Kayıp iadesi"], ["boost", "Kazanç artışı"], ["early", "Erken ödeme"]];
function numIn(v, def) { var x = parseFloat(String(v == null ? "" : v).trim().replace(",", ".")); return isFinite(x) ? x : def; }
/** Bedava bahsin bir seçimdeki değeri (TL başına): tutar geri ödenmezse p·(o−1), ödenirse p·o. */
function freebetRate(p, o, returnStake) { return returnStake ? p * o : p * (o - 1); }
/** Kayıp iadeli bahsin beklenen kâr/zararı (TL): S(p·o − 1) + (1 − p)·min(r·S, üst sınır)·k (k: iadenin nakit karşılığı). */

/** Kazanç artışı: kazancın %b fazlası; yeni oran 1 + (o − 1)(1 + b). */
function boostOdds(o, b) { return 1 + (o - 1) * (1 + b); }
function poissonP(l) { var p = [Math.exp(-l)]; for (var k = 1; k <= 10; k++) p[k] = p[k - 1] * l / k; return p; }
/** Poisson gol modeli: {ev kazanır, deplasman kazanır, 2,5 üst}. */
function goalOutcomes(lh, la) {
  var h = poissonP(lh), a = poissonP(la), p1 = 0, p2 = 0, under = 0;
  for (var i = 0; i <= 10; i++) for (var j = 0; j <= 10; j++) {
    var q = h[i] * a[j];
    if (i > j) p1 += q; else if (j > i) p2 += q;
    if (i + j <= 2) under += q;
  }
  return [p1, p2, 1 - under];
}
/** MS 1, MS 2 ve 2,5 Üst adil olasılıklarına en iyi uyan gol beklentileri (ev, deplasman). */
function fitGoals(p1, p2, over) {
  var best = [1.3, 1.1], err = Infinity;
  function test(lh, la) {
    if (lh <= 0 || la <= 0) return;
    var o = goalOutcomes(lh, la), e = Math.pow(o[0] - p1, 2) + Math.pow(o[1] - p2, 2) + Math.pow(o[2] - over, 2);
    if (e < err) { err = e; best = [lh, la]; }
  }
  for (var lh = 0.1; lh <= 4.0; lh += 0.1) for (var la = 0.1; la <= 4.0; la += 0.1) test(lh, la);
  var ch = best[0], ca = best[1];
  for (var dh = -0.1; dh <= 0.1; dh += 0.01) for (var da = -0.1; da <= 0.1; da += 0.01) test(ch + dh, ca + da);
  return best;
}
/**
 * Erken ödeme: takım maç içinde herhangi bir anda x fark öne geçerse bahis kazanmış sayılır.
 * Dakika dakika gol modeliyle P(x farka ulaşır ya da sonunda kazanır); x = 99 normal kazanma olasılığı.
 */
function leadWin(lf, la, x) {
  var N = 90, pf = lf / N, pa = la / N, off = 15, size = off + Math.min(x, 20), P = [], d, absorbed = 0;
  for (d = 0; d < size; d++) P[d] = 0;
  P[off] = 1;
  for (var t = 0; t < N; t++) {
    var Q = [];
    for (d = 0; d < size; d++) Q[d] = 0;
    for (d = 0; d < size; d++) {
      var m = P[d];
      if (!m) continue;
      if (d + 1 === off + x) absorbed += m * pf; else Q[Math.min(d + 1, size - 1)] += m * pf;
      Q[Math.max(d - 1, 0)] += m * pa;
      Q[d] += m * (1 - pf - pa);
    }
    P = Q;
  }
  var win = absorbed;
  for (d = off + 1; d < size; d++) win += P[d];
  return win;
}
/** Erken ödemenin kazanma olasılığına katkısı (model): P(kural) − P(normal kazanma), seçilen taraf için. */
function earlyUplift(row, side, x) {
  var g = {}, i;
  for (i = 0; i < row.sel.length; i++) g[row.sel[i].m + row.sel[i].o] = row.sel[i].p;
  if (g.MS1 == null || g.MS2 == null || g.AU25UST == null) return null;
  var key = row.ref + "|" + (row.at || "") + "|" + x + "|" + side; // tarama yenilenince model de yenilenir
  if (earlyCache[key] != null) return earlyCache[key];
  var l = fitGoals(g.MS1, g.MS2, g.AU25UST), lf = side === "1" ? l[0] : l[1], la = side === "1" ? l[1] : l[0];
  return (earlyCache[key] = Math.max(0, leadWin(lf, la, x) - leadWin(lf, la, 99)));
}
var earlyCache = {};
/** Kampanyaya göre en değerli 5 seçim ve özet (değerler kuruş). */
function campResults() {
  var c = CAMP, now = Date.parse(S.now), minOdds = numIn(c.minOdds, 1), amount = numIn(c.amount, 0) * 100, minProb = campMinProb();
  var rows = fairsTable().filter(function (r) { return Date.parse(r.kickoff) > now; }), out = [];
  var bestFree = 0; // iade bedava bahis olarak gelirse 1 TL'sinin nakit karşılığı
  rows.forEach(function (r) { r.sel.forEach(function (x) { if (x.i >= minOdds) bestFree = Math.max(bestFree, freebetRate(x.p, x.i, false)); }); });
  rows.forEach(function (r) {
    r.sel.forEach(function (x) {
      if (!(x.i >= minOdds) || !(x.p > 0)) return;
      if ((x.mbs || 1) > 1 && !c.combos) return; // tek maçlık kampanya: MBS'si 1'den büyük maç tek oynanamaz
      if (x.p < minProb) return; // seyrek tutan seçim önerilmez
      var v = null, ev = null, odds = x.i, note = "";
      if (c.type === "freebet") {
        v = amount * freebetRate(x.p, x.i, c.returnStake);
      } else if (c.type === "cashback") {
        var k = c.refund === "nakit" ? 1 : bestFree;
        v = cashbackEv(x.p, x.i, amount, numIn(c.pct, 0) / 100, numIn(c.cap, 0) * 100, k);
        ev = amount > 0 ? v / amount : null;
      } else if (c.type === "boost") {
        odds = boostOdds(x.i, numIn(c.boost, 0) / 100);
        ev = x.p * odds - 1;
        v = amount * ev;
      } else if (c.type === "early") {
        if (x.m !== "MS" || x.o === "X") return;
        var up = earlyUplift(r, x.o, Math.max(1, Math.round(numIn(c.lead, 2))));
        if (up == null) return;
        ev = (x.p + up) * x.i - 1;
        v = amount * ev;
        note = "+" + num(up * 100, 1) + " puan";
      }
      out.push({r: r, x: x, v: v, ev: ev, odds: odds, note: note});
    });
  });
  out.sort(function (a, b) { return (b.v - a.v) || ((b.ev || 0) - (a.ev || 0)); });
  if (c.sort === "prob" && out.length) {
    // en sık tutanlar: değeri en iyinin en az yarısı olanlar arasından tutma olasılığına göre
    var bestV = out[0].v;
    out = out.filter(function (e) { return bestV <= 0 ? e.v >= bestV * 1.5 : e.v >= bestV * 0.5; });
    out.sort(function (a, b) { return b.x.p - a.x.p; });
  }
  return out.slice(0, 5);
}

function chart() {
  var s = S.series;
  if (s.length < 2) return '<p class="muted small">Grafik ilk kupon sonuçlanınca oluşur.</p>';
  var w = 340, h = 150, pad = 6, ts = s.map(function (p) { return Date.parse(p[0]); }), vs = s.map(function (p) { return p[1] / 100; });
  var t0 = Math.min.apply(null, ts), t1 = Math.max.apply(null, ts), lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
  if (hi === lo) hi = lo + 1;
  var span = (t1 - t0) || 1, pts = [];
  function xy(t, v) { return [pad + (t - t0) / span * (w - 2 * pad), h - pad - (v - lo) / (hi - lo) * (h - 2 * pad)]; }
  for (var i = 0; i < ts.length; i++) { if (i) pts.push(xy(ts[i], vs[i - 1])); pts.push(xy(ts[i], vs[i])); }
  var line = pts.map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
  var last = pts[pts.length - 1];
  return '<svg class="chart" viewBox="0 0 ' + w + " " + h + '"><polygon points="' + pad + "," + (h - pad) + " " + line + " " + last[0].toFixed(1) + "," + (h - pad)
    + '" fill="var(--accent)" opacity=".13"/><polyline points="' + line + '" fill="none" stroke="var(--accent)" stroke-width="2"/></svg>'
    + '<div class="small muted" style="display:flex;justify-content:space-between"><span>en düşük ' + num(lo, 2) + " TL</span><span>en yüksek " + num(hi, 2) + " TL</span></div>";
}

var MONTHS = ["Oca", "Şub", "Mar", "Nis", "May", "Haz", "Tem", "Ağu", "Eyl", "Eki", "Kas", "Ara"];
function bars(rows) {
  rows = rows.filter(function (r) { return r.n > 0; });
  if (!rows.length) return '<p class="small muted">Henüz sonuçlanmış oynanan kupon yok.</p>';
  var max = Math.max.apply(null, rows.map(function (r) { return Math.abs(r.pl); })) || 1;
  return '<div class="bars">' + rows.map(function (r) {
    var w = Math.abs(r.pl) / max * 50;
    var fill = '<div class="fill ' + (r.pl >= 0 ? "pos" : "neg") + '" style="' + (r.pl >= 0 ? "left:50%" : "right:50%") + ";width:" + w.toFixed(1) + '%"></div>';
    var key = /^\d{4}-\d{2}$/.test(r.key) ? MONTHS[+r.key.slice(5) - 1] + " " + r.key.slice(0, 4) : r.key;
    return '<div class="bar"><span>' + esc(key) + '<br><span class="muted">' + r.won + "/" + r.n + (r.clv != null ? " · CLV " + pct(r.clv, true) : "")
      + '</span></span><div class="track">' + fill + '</div><span class="r ' + cls(r.pl) + '">' + tl(r.pl) + "<br>" + '<span class="muted">ROI ' + pct(r.roi, true) + "</span></span></div>";
  }).join("") + "</div>";

function accuracyCard() {

    + "Bu fark sonuçlardan çok yavaş ölçülür (binlerce maç); avantajın daha hızlı ve güvenilir göstergesi yukarıdaki kapanış oranı testidir.</p></div>";

  else if (a.diff < -2 * se) verdict = "iddaa'nın olasılıkları daha isabetli çıktı (fark " + num(a.diff, 3) + " ± " + num(se, 3) + "): önerilen avantajlar gerçek olmayabilir.";
  else verdict = "Fark henüz anlamlı değil (" + num(a.diff, 3) + " ± " + num(se, 3) + "); daha çok maç gerekir.";

    + '<div class="two"><div><label>Kredi yenilenme günü (ayın)</label><input id="sResetDay" inputmode="numeric" value="' + st.creditResetDay + '"></div></div>';
  if (p) {
    html += '<div class="list" style="margin-top:8px">'
      + item("Kalan kredi", p.remaining != null ? String(p.remaining) + " / ayda " + p.quota : "henüz bilinmiyor")
      + item("Yenilenmeye", p.daysLeft + " gün")
      + item("Günlük bütçe / tahmini gider", "~" + num(p.budget, 1) + " / ~" + num(p.cost, 0) + " kredi")
      + item("Bugün taranan ligler", esc(p.leagues.filter(function (l) { return (p.expanded || []).indexOf(l) < 0; }).map(leagueName).join(", ")))
      + (p.expanded && p.expanded.length ? item("Kredi bol, ek ligler", esc(p.expanded.map(leagueName).join(", "))) : "")
      + item("Alt/Üst · KG · radar", (p.totals ? "açık" : "kapalı") + " · " + (p.kgEvents ? p.kgEvents + " maç" : "kapalı") + " · " + (p.radarScans ? "günde " + p.radarScans : "kapalı")
        + (p.lineupScans ? " + kadro saati" : ""))
      + item("Günlük kupon", "en fazla " + p.coupons)
      + "</div>" + (p.notes.length ? '<p class="small muted">' + esc(p.notes.join("; ")) + ".</p>" : "")
      + (p.activeKnown === false && st.oddsApiKey ? '<p class="small muted">Bugün hangi liglerin oynadığı henüz sorulmadı (ör. güncellemeden sonra): '
        + "gider her ligin %40 ihtimalle oynadığı varsayımıyla tahmin edildi ve ek lig eklenmedi. Sabahki çalışmada kendiliğinden öğrenilir.</p>"
        + '<div class="btns"><button class="b ghost" onclick="act(\'probe\')">Bugünün maçlarını sor (ücretsiz)</button></div>' : "");
  }
  return html + '<p class="small muted">Kredi, The Odds API anahtarının aylık sorgu kotasıdır (uygulamayı tek kişi kullansa da). Kredi yetmezse önce Karşılıklı Gol, sonra radar, günlük kupon 5→3, Alt/Üst, en son en az değerli fırsat çıkaran lig kısılır. '
    + "Kredi bolsa (ör. birden fazla anahtar) seçmediğin ligler de o gün taranır: bugün maçı olan, geçmişte en çok değerli seçim çıkaran önce; tahmini gider günlük bütçenin %85'ini geçmez. "
    + "Her gün gerçek kalan krediye göre yeniden hesaplanır.</p></div>";
}
function readNum(id, isPct) {
  // Türkçe yazım: "1.000" bin, "2,5" iki buçuk (Python ve Java tarafındaki parse_tl ile aynı kural)
  var raw = val(id).replace(/\s/g, "");
  if (raw.indexOf(",") >= 0) raw = raw.replace(/\./g, "").replace(",", ".");
  else if (/^\d{1,3}(\.\d{3})+$/.test(raw)) raw = raw.replace(/\./g, "");
  var n = parseFloat(raw);
  if (isNaN(n)) throw new Error("Geçersiz sayı: " + val(id));
  return isPct ? n / 100 : n;
}
function collectSettings() {
  var st = JSON.parse(JSON.stringify(S.settings));
  var keys = [];
  for (var i = 0; i < MAX_KEYS; i++) { var k = val("sKey" + i); if (k && keys.indexOf(k) < 0) keys.push(k); }
  st.oddsApiKey = keys.join("\n");
  st.leagues = Array.prototype.slice.call(document.querySelectorAll(".lg:checked")).map(function (x) { return x.value; });
  var t = val("sTime").split(":");
  st.runHour = parseInt(t[0], 10); st.runMinute = parseInt(t[1], 10);
  st.radarScans = parseInt(val("sRadar") || "0", 10);
  var lu = document.getElementById("sLineup"), qn = document.getElementById("sQuiet");
  st.lineupScans = !!(lu && lu.checked);
  st.quietNights = !!(qn && qn.checked);
  var zv = document.getElementById("sZirve");
  st.zirve = !!(zv && zv.checked);
  var pk = document.getElementById("sPick");
  if (pk) {
    st.dailyPick = pk.checked;
    st.pickMinProb = numIn(val("sPickProb"), 60) / 100;
    st.pickHighProb = numIn(val("sPickHigh"), 70) / 100;
    st.pickMaxLoss = numIn(val("sPickLoss"), 15) / 100;
    st.pickStake = numIn(val("sPickStake"), 0);
    st.singlesOnly = !!(document.getElementById("sSingles") || {}).checked;
  }
  var hc = document.getElementById("sHandicap");
  if (hc) st.basketHandicap = hc.checked;
  var tot = document.getElementById("sTotals");
  st.totals = !!(tot && tot.checked);
  st.kgEvents = parseInt(val("sKg") || "0", 10);
  var au = document.getElementById("sAuto"), ca = document.getElementById("sCreditAuto"), eg = document.getElementById("sEdge"), ni = document.getElementById("sIntl");
  st.autoTrack = !!(au && au.checked);
  st.internationals = !!(ni && ni.checked);
  var bx = document.getElementById("sBasketExtras");
  if (bx) st.basketExtras = bx.checked;
  st.edgeGuard = !!(eg && eg.checked);
  st.creditAuto = !!(ca && ca.checked);
  var ce = document.getElementById("sCreditExpand");
  st.creditExpand = !!(ce && ce.checked);
  st.creditResetDay = parseInt(val("sResetDay") || "1", 10);
  FIELDS.forEach(function (f) { st[f[0]] = readNum("f_" + f[0], f[2]); });
  st.maxLegs = Math.round(st.maxLegs);
  st.maxCouponsPerDay = Math.round(st.maxCouponsPerDay);
  return st;
}
function saveSettings() {
  try { act("saveSettings", {settings: collectSettings()}); } catch (e) { toast(e.message, true); }
}
var lastCheck = "";
function checkSources() {
  var out = document.getElementById("checkOut");
  var save;
  try { save = collectSettings(); } catch (e) { toast(e.message, true); return; }
  act("saveSettings", {settings: save}, true).then(function (r) {
    if (!r.ok) return;
    act("check").then(function (res) {
      lastCheck = res.message || "";
      render(); // çıktı ve "Çıktıyı paylaş" düğmesi
    });
  });
}
function importData() {
  var data = val("sImport");
  if (!data) { toast("Önce yedek metnini yapıştır", true); return; }
  openSheet('<h3>Yedeği geri yükle</h3><p class="muted">Mevcut kasa, kupon ve ayarlar bu yedekle değiştirilecek. Emin misin?</p>'
    + '<div class="btns"><button class="b ghost" onclick="closeSheet()">Vazgeç</button><button class="b warn" id="doImport">Geri yükle</button></div>');
  document.getElementById("doImport").onclick = function () { closeSheet(); act("import", {data: data}); };
}

if (/^#(bugun|firsat|gecmis|kasa|ayarlar)$/.test(location.hash)) tab = location.hash.slice(1);
refresh();
</script>
