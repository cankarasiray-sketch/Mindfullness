<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bilinçli Kupon</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#14171c;--muted:#5d6672;--line:#e3e6eb;--accent:#0f6e56;
--accent-ink:#fff;--accent-soft:#e3f2ec;--bad:#b42318;--bad-soft:#fdecea;--warn:#8a5a00;--warn-soft:#fff4dc;
--chip:#eef1f4;--top:#0b3d31;--top-ink:#e9f5f0}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#171b21;--ink:#e8ebef;--muted:#9aa3ae;
--line:#2a3038;--accent:#4cc39a;--accent-ink:#06261d;--accent-soft:#16322a;--bad:#f2867c;--bad-soft:#3a1d1b;
--warn:#f0c065;--warn-soft:#33290f;--chip:#222831;--top:#0b3d31}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
input[type=checkbox]{accent-color:var(--accent)}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Roboto,"Segoe UI",sans-serif}
header{background:var(--top);color:var(--top-ink);padding:14px 16px 12px;position:sticky;top:0;z-index:5}
header .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:17px;margin:0;font-weight:650}
header .bal{font-size:12px;opacity:.8;text-align:right}
header .bal b{display:block;font-size:17px;opacity:1;font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;
background:#f0c065;color:#3a2a00;margin-left:6px;vertical-align:2px}
main{padding:12px 12px 96px;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);
display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:10px 0 12px;color:var(--muted);font:inherit;font-size:12px;
display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--accent);font-weight:650}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card h2{font-size:15px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 6px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile .k{font-size:11.5px;color:var(--muted)}.tile .v{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}.small{font-size:12.5px}.pos{color:var(--accent)}.neg{color:var(--bad)}
.kicker{font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--muted)}
.big{font-size:22px;font-weight:750;margin:2px 0 6px}
.leg{border-top:1px solid var(--line);padding:10px 0}
.leg:first-of-type{border-top:0}
.leg .top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.leg .teams{font-weight:600;margin:2px 0 6px}
.leg .pick{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--chip);font-weight:650;font-size:13px}
.chip.main{background:var(--accent-soft);color:var(--accent)}
.odds{font-size:18px;font-weight:750;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:650}
.pill.kazandi{background:var(--accent-soft);color:var(--accent)}
.pill.kaybetti{background:var(--bad-soft);color:var(--bad)}
.pill.iade,.pill.bek{background:var(--chip);color:var(--muted)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.sum div span{display:block;font-size:11.5px;color:var(--muted)}.sum div b{font-size:15px;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button.b{font:inherit;font-weight:600;padding:10px 16px;border-radius:10px;border:1px solid var(--accent);
background:var(--accent);color:var(--accent-ink);flex:1;min-width:120px}
button.b.ghost{background:transparent;color:var(--accent)}
button.b.warn{border-color:var(--bad);background:transparent;color:var(--bad)}
button.b:disabled{opacity:.5}
.banner{border-radius:12px;padding:12px;margin:10px 0;background:var(--warn-soft);color:var(--warn);font-size:13.5px}
.banner button{margin-top:8px}
label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
input,textarea,select{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
background:var(--bg);color:var(--ink)}
textarea{min-height:90px;font-size:12px;font-family:ui-monospace,monospace}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.check{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);color:var(--ink);margin:0;font-size:14px}
.check input{width:20px;height:20px;flex:none}
.list .item{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.list .item:first-child{border-top:0}
pre.out{white-space:pre-wrap;font-size:12px;background:var(--bg);border-radius:10px;padding:10px;margin:10px 0 0}
svg.chart{width:100%;height:auto;display:block}
#toast{position:fixed;left:12px;right:12px;bottom:80px;background:#1f2329;color:#fff;border-radius:12px;padding:12px 14px;
font-size:14px;opacity:0;transform:translateY(10px);transition:all .2s;z-index:20;pointer-events:none;white-space:pre-wrap}
#toast.show{opacity:1;transform:none}
#toast.err{background:#7a1d16}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:none;align-items:flex-end}
.sheet-bg.show{display:flex}
.sheet{background:var(--card);width:100%;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 6px;font-size:17px}
.busy{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:40;display:none;align-items:center;justify-content:center}
.busy.show{display:flex}
.spinner{width:42px;height:42px;border-radius:50%;border:4px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin 1s linear infinite}
.busy{flex-direction:column;gap:14px}.busy .progress{color:#fff;font-size:14px;max-width:80%;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.6)}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:26px 10px}
.verdict{border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13.5px}
.verdict.ok{background:var(--accent-soft);color:var(--accent)}
.verdict.no{background:var(--bad-soft);color:var(--bad)}
.verdict.old{background:var(--chip);color:var(--muted)}
.now{font-size:12.5px;margin-top:4px}
.st{display:inline-block;white-space:nowrap;padding:0 7px;border-radius:999px;font-size:11.5px;font-weight:650;background:var(--chip);color:var(--muted)}
.st.ok{background:var(--accent-soft);color:var(--accent)}.st.bad{background:var(--bad-soft);color:var(--bad)}
.fresh{font-size:12px;color:var(--muted);margin-top:2px}
.fresh.stale{color:var(--warn);font-weight:600}
.prof{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.prof.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.prof h4{margin:0 0 4px;font-size:15px}
.range{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.range div{background:var(--bg);border-radius:10px;padding:8px}.range span{display:block;font-size:11.5px;color:var(--muted)}
.range b{font-variant-numeric:tabular-nums}
.plan .prow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:9px 0;border-top:1px solid var(--line)}
.plan .muted+.prow{border-top:0}
.plan .amt .small{font-weight:500}
.plan .st{margin:2px 0}
.plan .amt{font-size:18px;font-weight:750;text-align:right;font-variant-numeric:tabular-nums}
.plan .tot{display:flex;justify-content:space-between;padding-top:10px;border-top:2px solid var(--line);margin-top:4px;font-weight:650}
.vrow{border-top:1px solid var(--line);padding:9px 0}.vrow:first-child{border-top:0}
.vrow .l1{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.vrow .l2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px}
.bars .bar{display:grid;grid-template-columns:96px 1fr 92px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:12.5px}
.bars .bar:first-child{border-top:0}
.bars .track{height:10px;background:var(--chip);border-radius:6px;position:relative;overflow:hidden}
.bars .fill{position:absolute;top:0;bottom:0;border-radius:6px}
.bars .fill.pos{background:var(--accent)}.bars .fill.neg{background:var(--bad)}
.bars .r{text-align:right;font-variant-numeric:tabular-nums}
details.info summary{cursor:pointer;font-weight:600}
nav button{font-size:11px}
.empty .big{font-size:20px}
p{margin:6px 0}
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>Bilinçli Kupon<span id="demoBadge"></span></h1>
    <div class="bal">Kasa<b id="hdrBal">-</b></div>
  </div>
</header>
<main id="view"></main>
<nav id="nav"></nav>
<div id="toast"></div>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="busy" id="busy"><div class="spinner"></div><div class="progress" id="progress"></div></div>
<script>
"use strict";
// ---- köprü ----------------------------------------------------------------
var pending = {}, seq = 0, S = null, tab = "bugun", history_ = [];
function bridge() { return window.Android || window.MockAndroid; }
function act(action, payload, quiet) {
  return new Promise(function (resolve) {
    var id = "c" + (++seq);
    pending[id] = resolve;
    if (!quiet) busy(true);
    bridge().act(action, JSON.stringify(payload || {}), id);
  });
}
window.onActResult = function (id, res) {
  busy(false);
  var r = pending[id]; delete pending[id];
  if (res && res.message) toast(shortMessage(res.message), !res.ok);
  refresh();
  if (r) r(res);
};
window.refresh = function () {
  try { S = JSON.parse(bridge().state()); } catch (e) { toast("Durum okunamadı: " + e, true); return; }
  render();
};
window.goBack = function () {
  if (document.getElementById("sheetBg").classList.contains("show")) { closeSheet(); return true; }
  if (tab !== "bugun") { show("bugun"); return true; }
  return false;
};

// ---- biçimlendirme ----------------------------------------------------------
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c];
  });
}
function group(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
function tl(k) {
  if (k == null) return "-";
  var sign = k < 0 ? "-" : "", a = Math.abs(Math.round(k));
  return sign + group(Math.floor(a / 100)) + "," + String(a % 100).padStart(2, "0") + " TL";
}
function num(x, d) {
  var s = Math.abs(x).toFixed(d), parts = s.split(".");
  return (x < 0 ? "-" : "") + group(parts[0]) + (parts[1] ? "," + parts[1] : "");
}
function odds(x) { return num(x, 2); }
function pct(x, signed) {
  if (x == null) return "-";
  var sign = signed ? (x > 0 ? "+" : x < 0 ? "−" : "") : (x < 0 ? "−" : "");
  return sign + "%" + num(Math.abs(x) * 100, 1);
}
function trDate(iso) { return new Date(Date.parse(iso) + 3 * 3600 * 1000); }
function hm(iso) { var d = trDate(iso); return String(d.getUTCHours()).padStart(2, "0") + ":" + String(d.getUTCMinutes()).padStart(2, "0"); }
function dm(iso) { var d = trDate(iso); return String(d.getUTCDate()).padStart(2, "0") + "." + String(d.getUTCMonth() + 1).padStart(2, "0"); }
function dayLabel(day) { var p = day.split("-"); return p[2] + "." + p[1] + "." + p[0]; }
/** Karar özeti: istatistik satırı soluk; pas gününde "En yakın seçim" ayrı satırda. */
function summaryHtml(summary) {
  return (summary || "").split("\n").map(function (line) {
    var near = line.indexOf("En yakın seçim: ") === 0;
    return near ? '<p class="small"><b>En yakın seçim:</b> ' + esc(line.slice(16)) + "</p>" : '<p class="small muted">' + esc(line) + "</p>";
  }).join("");
}
function label(market, outcome) {
  if (market === "MS") return "MS " + outcome;
  if (market === "BS") return "Basket MS " + outcome;
  if (market.indexOf("BT@") === 0) return "Basket " + market.slice(3).replace(".", ",") + (outcome === "ALT" ? " Alt" : " Üst");
  if (market === "AU25") return outcome === "ALT" ? "2,5 Alt" : "2,5 Üst";
  if (market === "KG") return outcome === "VAR" ? "KG Var" : "KG Yok";
  if (market === "CS") return "ÇŞ " + outcome.charAt(0) + "-" + outcome.charAt(1);
  return market + " " + outcome;
}
var RESULT = {kazandi: "Tuttu", kaybetti: "Yattı", iade: "İade"};
function pill(r) { return r ? '<span class="pill ' + esc(r) + '">' + RESULT[r] + "</span>" : '<span class="pill bek">Bekliyor</span>'; }
function cls(v) { return v > 0 ? "pos" : v < 0 ? "neg" : ""; }
function minsSince(iso) { return Math.max(0, Math.round((Date.parse(S.now) - Date.parse(iso)) / 60000)); }
function ago(iso) { var m = minsSince(iso); return m < 1 ? "az önce" : m < 60 ? m + " dk önce" : Math.floor(m / 60) + " sa " + (m % 60) + " dk önce"; }
function checkFresh(ch) { return !!ch && (Date.parse(S.now) - Date.parse(ch.at)) / 1000 <= S.freshSeconds; }
var STATUS = {ok: ["güncel, hâlâ avantajlı", "ok"], edge_lost: ["avantaj kayboldu", "bad"], started: ["başladı", "bad"],
  not_found: ["bültende yok", "bad"], no_fair: ["adil oran yok", "bad"], mbs: ["MBS değişti", "bad"]};

// ---- arayüz yardımcıları ------------------------------------------------------
var toastTimer;
/** Uzun sonuçlar (ör. kaynak testi) balonu kaplamasın: ilk satır, ayrıntı ekranda. */
function shortMessage(m) {
  if (m.length <= 280) return m;
  var lines = m.split("\n"), first = lines[0];
  if (first.indexOf(":") < 0 && lines.length > 1) first = lines[1].trim(); // başlık satırını ("ÖZET") atla
  return (first.length > 200 ? first.slice(0, 200) + "…" : first) + " (ayrıntı ekranda)";
}
function toast(msg, err) {
  var t = document.getElementById("toast");
  t.textContent = msg; t.className = "show" + (err ? " err" : "");
  t.onclick = function () { t.className = ""; }; // dokununca kapanır
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.className = ""; }, err ? 6000 : 3500);
}
function busy(on) {
  document.getElementById("busy").className = "busy" + (on ? " show" : "");
  if (!on) document.getElementById("progress").textContent = "";
}
window.onProgress = function (text) { var p = document.getElementById("progress"); if (p) p.textContent = text; };
function openSheet(html) {
  document.getElementById("sheet").innerHTML = html;
  document.getElementById("sheetBg").className = "sheet-bg show";
}
function closeSheet() { document.getElementById("sheetBg").className = "sheet-bg"; }
document.getElementById("sheetBg").addEventListener("click", function (e) { if (e.target.id === "sheetBg") closeSheet(); });
function val(id) { var el = document.getElementById(id); return el ? el.value.trim() : ""; }

var ICONS = {
  bugun: '<path d="M4 18h4v-4h4v-4h4V6h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
  gecmis: '<circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 8v4l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
  kasa: '<rect x="3" y="6" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 12.5h2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M6 6l8-3 2 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
  firsat: '<circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 12l6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
  ayarlar: '<circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'
};
var TABS = [["bugun", "Bugün"], ["firsat", "Fırsatlar"], ["gecmis", "Geçmiş"], ["kasa", "Kasa"], ["ayarlar", "Ayarlar"]];
function show(t) { tab = t; render(); window.scrollTo(0, 0); }

function render() {
  if (!S) return;
  document.getElementById("hdrBal").textContent = tl(S.stats.balance);
  document.getElementById("demoBadge").innerHTML = S.demo ? '<span class="badge">DEMO</span>' : "";
  document.getElementById("nav").innerHTML = TABS.map(function (t) {
    return '<button class="' + (t[0] === tab ? "on" : "") + '" onclick="show(\'' + t[0] + '\')"><svg viewBox="0 0 24 24">'
      + ICONS[t[0]] + "</svg>" + t[1] + "</button>";
  }).join("");
  var v = document.getElementById("view");
  v.innerHTML = tab === "bugun" ? viewToday() : tab === "firsat" ? viewOpportunities() : tab === "gecmis" ? viewHistory()
    : tab === "kasa" ? viewMoney() : viewSettings();
}

// ---- Bugün ----------------------------------------------------------------
function couponById(id) {
  for (var i = 0; i < S.coupons.length; i++) if (S.coupons[i].id === id) return S.coupons[i];
  return null;
}
function tiles() {
  var s = S.stats;
  var t = function (k, v, c) { return '<div class="tile"><div class="k">' + k + '</div><div class="v ' + (c || "") + '">' + v + "</div></div>"; };
  return '<div class="grid">' + t("Bahis kâr/zarar", tl(s.bettingPl), cls(s.bettingPl)) + t("ROI", pct(s.roi, true), cls(s.bettingPl))
    + t("Tutan / oynanan", s.played ? s.won + " / " + s.played : "-") + t("Beklenen tutan", s.played ? num(s.expectedWins, 1) : "-") + "</div>";
}
function banners() {
  var out = [];
  if (S.demo) {
    var d = S.demoSummary;
    out.push('<div class="banner"><b>Demo modu.</b> Hayali takımlar ve sentetik veriyle 60 günlük simülasyon. '
      + (d ? "Bilinçli strateji " + tl(d.start) + " → " + tl(d.end) + "; her gün 'banko' 3'lü favori oynasaydın " + tl(d.baselineEnd) + ". " : "")
      + "Bu dünyada avantaj tasarım gereği var; gerçekte olup olmadığını yalnızca gerçek kayıt gösterir."
      + '<div class="btns"><button class="b ghost" onclick="act(\'demoStop\')">Demodan çık</button></div></div>');
    return out.join("");
  }
  if (!S.settings.oddsApiKey) out.push('<div class="banner"><b>Kurulumu tamamla:</b> Adil olasılıkları hesaplamak için ücretsiz The Odds API anahtarı gerekli.'
    + '<div class="btns"><button class="b" onclick="show(\'ayarlar\')">Anahtarı gir</button><button class="b ghost" onclick="act(\'demoStart\')">Önce demoyu gör</button></div></div>');
  if (S.stats.balance <= 0) out.push('<div class="banner">Kasan boş. Önerilen tutarlar kasana göre hesaplanır.'
    + '<div class="btns"><button class="b ghost" onclick="show(\'kasa\')">Kasaya para yatır</button></div></div>');
  if (S.settings.edgeGuard && S.edge && S.edge["*"] && S.edge["*"].factor < 0.999) out.push('<div class="banner"><b>Kanıt koruması devrede.</b> Son '
    + S.edge["*"].n + " seçimde avantajın çoğu kapanışa kadar erimiş; tutarlar ve kupon sayısı küçültüldü (×" + num(S.edge["*"].factor, 2) + ").</div>");
  if (S.creditPlan && S.creditPlan.narrowed && S.settings.oddsApiKey) out.push('<div class="banner"><b>Kredi planı bugün kapsamı daralttı</b> (günlük bütçe ~'
    + num(S.creditPlan.budget, 0) + " kredi): " + esc(S.creditPlan.notes.join("; ")) + '.<div class="btns"><button class="b ghost" onclick="show(\'ayarlar\')">Kredi planı</button></div></div>');
  if (S.credits && S.credits.remaining < 40) out.push('<div class="banner"><b>API kredisi az: ' + S.credits.remaining + ".</b> "
    + "Radar durdu, kalan kredi günlük karar için saklanıyor. Lig sayısını azalt, Alt/Üst ve KG'yi kapat ya da planını yükselt.</div>");
  if (S.clv.playedN >= 30 && S.clv.played < 0) out.push('<div class="banner"><b>Avantaj görünmüyor.</b> Oynadığın ' + S.clv.playedN
    + " seçim kapanış oranını ortalama " + pct(S.clv.played, true) + " ile yenemedi. Bu, piyasada avantaj olmadığının en güvenilir işaretidir; "
    + "bahsi durdurmayı ya da eşikleri yükseltmeyi düşün.</div>");

function chart() {
  var s = S.series;
  if (s.length < 2) return '<p class="muted small">Grafik ilk kupon sonuçlanınca oluşur.</p>';
  var w = 340, h = 150, pad = 6, ts = s.map(function (p) { return Date.parse(p[0]); }), vs = s.map(function (p) { return p[1] / 100; });
  var t0 = Math.min.apply(null, ts), t1 = Math.max.apply(null, ts), lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
  if (hi === lo) hi = lo + 1;
  var span = (t1 - t0) || 1, pts = [];
  function xy(t, v) { return [pad + (t - t0) / span * (w - 2 * pad), h - pad - (v - lo) / (hi - lo) * (h - 2 * pad)]; }
  for (var i = 0; i < ts.length; i++) { if (i) pts.push(xy(ts[i], vs[i - 1])); pts.push(xy(ts[i], vs[i])); }
  var line = pts.map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
  var last = pts[pts.length - 1];
  return '<svg class="chart" viewBox="0 0 ' + w + " " + h + '"><polygon points="' + pad + "," + (h - pad) + " " + line + " " + last[0].toFixed(1) + "," + (h - pad)
    + '" fill="var(--accent)" opacity=".13"/><polyline points="' + line + '" fill="none" stroke="var(--accent)" stroke-width="2"/></svg>'
    + '<div class="small muted" style="display:flex;justify-content:space-between"><span>en düşük ' + num(lo, 2) + " TL</span><span>en yüksek " + num(hi, 2) + " TL</span></div>";
}

      + '</div></div><div style="text-align:right">' + (!c.result && c.superseded ? '<span class="pill bek">Yenilendi</span>' : pill(c.result)) + '<div class="small ' + (pl == null ? "muted" : cls(pl)) + '">'
      + (pl == null ? (c.played ? tl(c.stake) : "oynanmadı") : tl(pl)) + "</div></div></div>";

var MONTHS = ["Oca", "Şub", "Mar", "Nis", "May", "Haz", "Tem", "Ağu", "Eyl", "Eki", "Kas", "Ara"];
function bars(rows) {
  rows = rows.filter(function (r) { return r.n > 0; });
  if (!rows.length) return '<p class="small muted">Henüz sonuçlanmış oynanan kupon yok.</p>';
  var max = Math.max.apply(null, rows.map(function (r) { return Math.abs(r.pl); })) || 1;
  return '<div class="bars">' + rows.map(function (r) {
    var w = Math.abs(r.pl) / max * 50;
    var fill = '<div class="fill ' + (r.pl >= 0 ? "pos" : "neg") + '" style="' + (r.pl >= 0 ? "left:50%" : "right:50%") + ";width:" + w.toFixed(1) + '%"></div>';
    var key = /^\d{4}-\d{2}$/.test(r.key) ? MONTHS[+r.key.slice(5) - 1] + " " + r.key.slice(0, 4) : r.key;
    return '<div class="bar"><span>' + esc(key) + '<br><span class="muted">' + r.won + "/" + r.n + (r.clv != null ? " · CLV " + pct(r.clv, true) : "")
      + '</span></span><div class="track">' + fill + '</div><span class="r ' + cls(r.pl) + '">' + tl(r.pl) + "<br>" + '<span class="muted">ROI ' + pct(r.roi, true) + "</span></span></div>";
  }).join("") + "</div>";
}
function accuracyCard() {
  var a = S.demo && S.demoSummary ? S.demoSummary.accuracy : S.accuracy;

  var head = '<div class="card"><h2>Tahmin isabeti</h2>';
  var foot = '<p class="small muted">Eşleşen her maçın olasılıkları kaydedilir, maç bitince sonuçla karşılaştırılır (skorlar kupon sonuçlandırmasında zaten çekildiği için ek kredi yok). '
    + "Log kayıp ve Brier: küçük olan daha isabetli. Uygulamanın kazanması için tahmininin, bahis oynadığın iddaa'nın kendi olasılıklarından isabetli olması gerekir. "
    + "Bu fark sonuçlardan çok yavaş ölçülür (binlerce maç); avantajın daha hızlı ve güvenilir göstergesi yukarıdaki kapanış oranı testidir.</p></div>";
  if (!a.n) return head + '<p class="muted">Henüz sonuçlanmış maç yok' + (a.pending ? " (" + a.pending + " maç bekliyor)" : "") + ".</p>" + foot;
  var m = function (x) { return "log kayıp " + num(x.logLoss, 3) + " · Brier " + num(x.brier, 3); };
  var rows = item("Değerlendirilen maç", a.n + (a.pending ? " · bekleyen " + a.pending : ""))

    + item("iddaa'nın kendi olasılıkları", m(a.book))
    + item("Yazı-tura (her sonuca 1/3)", "log kayıp 1,099 · Brier 0,667");
  var verdict, se = a.diffSe || 0;
  if (a.n < 100) verdict = "Yorum için en az 100 maç gerekir.";
  else if (a.diff > 2 * se) verdict = "Uygulamanın tahmini iddaa'dan anlamlı ölçüde isabetli (fark " + num(a.diff, 3) + " ± " + num(se, 3) + "): avantajın ön şartı sağlanıyor.";
  else if (a.diff < -2 * se) verdict = "iddaa'nın olasılıkları daha isabetli çıktı (fark " + num(a.diff, 3) + " ± " + num(se, 3) + "): önerilen avantajlar gerçek olmayabilir.";
  else verdict = "Fark henüz anlamlı değil (" + num(a.diff, 3) + " ± " + num(se, 3) + "); daha çok maç gerekir.";
  var bins = (a.bins || []).filter(function (b) { return b.n >= 20; }).map(function (b) {
    return item("%" + Math.round(b.from * 100) + "–" + Math.round(b.to * 100), "tahmin " + pct(b.predicted) + " → gerçekleşen " + pct(b.actual) + " (" + b.n + ")");
  }).join("");

    + (bins ? '<p class="small muted" style="margin-top:8px">Kalibrasyon: tahmin edilen olasılık ile gerçekleşme sıklığı (en az 20 sonuçlu dilimler)</p><div class="list">' + bins + "</div>" : "")
    + foot;
}

  html += '<div class="card"><h2>Pazarlar</h2><p class="small muted">Daha çok pazar, daha çok değerli fırsat demektir. Her pazar, iddaa bülteniyle Pinnacle '
    + "karşılaştırılarak otomatik doğrulanır; eşleşme belirsizse kullanılmaz.</p>"
    + '<label class="check"><input type="checkbox" checked disabled>Maç Sonucu (1-X-2)</label>'
    + '<label class="check"><input type="checkbox" id="sTotals"' + (st.totals ? " checked" : "") + '>Alt/Üst: futbolda 2,5, basketbolda toplam sayı <span class="small muted">(lig başına kredi ×2)</span></label>'
    + '<label>Karşılıklı Gol: günde en fazla kaç maç</label><select id="sKg">' + [[0, "Kapalı"], [4, "4 maç"], [8, "8 maç"], [12, "12 maç"]].map(function (o) {
      return '<option value="' + o[0] + '"' + (st.kgEvents === o[0] ? " selected" : "") + ">" + o[1] + "</option>";
    }).join("") + '</select><p class="small muted">KG oranı Pinnacle\'dan maç bazında çekilir (maç başına 1 kredi). Önce ücretsiz model ön elemesi yapılır: iddaa\'nın KG oranı avantaj veremeyecek kadar düşükse o maç sorulmaz, kredi harcanmaz. '
    + 'Korner gibi pazarlar için güvenilir keskin fiyat kaynağı doğrulanamadığından eklenmedi; "Kaynakları test et" çıktısındaki pazar envanterini paylaşırsan eşlenebilir.</p></div>';
  var lgBox = function (l) {
    return '<label class="check"><input type="checkbox" class="lg" value="' + esc(l[0]) + '"' + (st.leagues.indexOf(l[0]) >= 0 ? " checked" : "") + ">" + esc(l[1]) + "</label>";
  };
  var isBasket = function (l) { return l[0].indexOf("basketball_") === 0; };
  html += '<div class="card"><h2>Ligler</h2>' + S.knownLeagues.filter(function (l) { return !isBasket(l); }).map(lgBox).join("")
    + '<p class="small muted">Seçili lig yalnızca maçı olduğu gün kredi harcar (tarama başına 1, Alt/Üst açıkken 2). Maç listesi sorgusu ücretsizdir.</p></div>';
  html += '<div class="card" id="basketCard"><h2>Basketbol</h2>' + S.knownLeagues.filter(isBasket).map(lgBox).join("")
    + '<p class="small muted">Maç sonucu (uzatmalar dahil, beraberlik yok) ve Pazarlar\'da Alt/Üst açıksa toplam sayı Alt/Üst (uzatmalar dahil). '
    + 'Tarama başına 1 kredi, Alt/Üst açıkken 2. Avantajlı seçimler futbolla aynı günün kuponlarına girer ("Basket MS 1", "Basket 161,5 Üst"). '
    + 'Alt/Üst\'te iddaa\'nın çizgisi Pinnacle\'ın ana çizgisinden en fazla 3 sayı farklıysa olasılık o çizgiye çevrilir; tam sayı çizgiler kullanılmaz. '
    + 'iddaa pazarları Pinnacle\'la karşılaştırılarak otomatik bulunur; "Kaynakları test et" özetinde Basketbol MS ve Basketbol Alt/Üst ✓ görünmeli.</p></div>';
  html += '<div class="card"><h2>Düşen oran radarı</h2><p class="small muted">Gün içinde piyasayı yeniden tarar: Pinnacle\'da oranı hızla düşen sonuçları ve '
    + "sabah olmayan yeni değer fırsatlarını bulur. Bugün oynanmış kupon yoksa güncel oranlarla yeni kupon önerir ve bildirir.</p>"
    + '<label>Tarama sıklığı</label><select id="sRadar">' + [[0, "Kapalı"], [1, "Günde 1"], [2, "Günde 2"], [4, "Günde 4"]].map(function (o) {
      return '<option value="' + o[0] + '"' + (st.radarScans === o[0] ? " selected" : "") + ">" + o[1] + "</option>";
    }).join("") + '</select><p class="small muted">Taramalar günün maç saatlerine göre, maç gruplarından ~2,5 saat önceye yerleştirilir (o saatte Pinnacle fiyatı olgun, iddaa çoğu zaman henüz güncellenmemiş); maç bilgisi yoksa 10–19 arası sabit saatler. Tahmini aylık kredi: ~' + st.estimatedCredits + " (ücretsiz plan 500). "
    + (st.estimatedCredits > 500 ? "<b>Ücretsiz planı aşar:</b> birden fazla anahtar ekle, lig sayısını azalt ya da ücretli plana geç." : "Ücretsiz plana sığar.") + "</p>"
    + '<label class="check"><input type="checkbox" id="sLineup"' + (st.lineupScans ? " checked" : "") + ">Kadro saati taraması</label>"
    + '<p class="small muted">İlk 11\'ler maçtan ~60 dk önce açıklanır; Pinnacle hemen tepki verir, iddaa çoğu zaman gecikir. Her maç grubundan ~45 dk önce yalnızca o saatte oynayan ligler taranır; '
    + "avantaj çıkarsa bugünkü kuponlara dokunmadan ek kupon önerilir ve bildirilir. Kredi: her lig günde bir tarama daha; kredi yetmezse plan bunu Karşılıklı Gol'den sonra kapatır.</p></div>";
  html += '<div class="card"><h2>Zamanlama</h2><label>Günlük karar saati (Türkiye)</label><input id="sTime" type="time" value="'
    + String(st.runHour).padStart(2, "0") + ":" + String(st.runMinute).padStart(2, "0") + '"><p class="small muted">Sonraki çalışma: '
    + esc(dm(S.nextRun)) + " " + esc(hm(S.nextRun)) + ". Biten maçlar 3 saatte bir kontrol edilir.</p>"
    + '<label class="check"><input type="checkbox" id="sQuiet"' + (st.quietNights ? " checked" : "") + ">Gece (00:00–08:00) bildirimleri sessiz</label>"
    + '<p class="small muted">Gece maçlarının (ör. NBA) maç öncesi kontrolleri sesli uyandırmaz; bildirim sabah bildirim alanında durur.</p></div>';
  html += profilesCard(st);
  html += '<div class="card"><h2>Kasa takibi</h2><label class="check"><input type="checkbox" id="sAuto"' + (st.autoTrack ? " checked" : "") + ">Otomatik</label>"
    + '<p class="small muted">Açıkken: ilk maçtan 90 dk önce kupon güncel iddaa ve Pinnacle oranlarıyla kontrol edilir; hâlâ avantajlıysa o anki oranlar ve güncel kasaya göre '
    + "tutarla oynanmış sayılır, bildirim gelir, sonuçla kasa kendiliğinden güncellenir. Oynamadıysan \"Oynamadım, geri al\". Kapalıyken yalnızca \"Oynadım\"a bastığın kuponlar kasadan düşer.</p></div>";
  var intl = S.intlLeagues || [];
  html += '<div class="card"><h2>Milli maçlar</h2><label class="check"><input type="checkbox" id="sIntl"' + (st.internationals ? " checked" : "") + ">Aktif milli turnuvaları otomatik tara</label>"
    + '<p class="small muted">' + (intl.length ? "Şu an aktif: " + esc(intl.map(function (x) { return x[1]; }).join(", ")) + "."
      : "Aktif milli turnuva listesi henüz alınmadı (Kaynakları test et ile güncellenir).")
    + " Liste The Odds API'den günde bir kez ücretsiz alınır; milli maç arasında lig maçı olmadığında kupon bu maçlardan kurulur. Takım adları Türkçe–İngilizce eşlenir (Almanya ⇄ Germany).</p></div>";
  html += '<div class="card"><h2>Kanıt koruması</h2><label class="check"><input type="checkbox" id="sEdge"' + (st.edgeGuard ? " checked" : "") + ">Açık</label>"
    + '<p class="small muted">Kapanış oranları avantajın yarısından fazlasının eridiğini gösterirse tutarlar kendiliğinden küçülür. Ayrıntı: Geçmiş → Kanıt koruması.</p></div>';
  html += creditCard(st);
  html += '<div class="card"><h2>Strateji ve kasa koruması</h2><div class="two">' + FIELDS.map(function (f) {
    var v = st[f[0]], shown = f[2] ? +(v * 100).toFixed(2) : v;
    return '<div><label>' + f[1] + '</label><input id="f_' + f[0] + '" inputmode="decimal" value="' + esc(String(shown).replace(".", ",")) + '"></div>';
  }).join("") + "</div>"
    + '<p class="small muted">Eşikleri düşürmek daha çok kupon üretir ama her birinin avantajı daha belirsiz olur.</p>'
    + '<div class="btns"><button class="b" onclick="saveSettings()">Ayarları kaydet</button></div></div>';
  html += '<div class="card"><h2>Veri</h2><div class="btns"><button class="b ghost" onclick="act(\'export\',{},true)">Yedeği paylaş</button>'
    + '<button class="b ghost" onclick="act(\'testNotification\')">Bildirimi test et</button></div>'
    + '<label>Yedeği geri yükle (yedek metnini yapıştır)</label><textarea id="sImport"></textarea>'
    + '<div class="btns"><button class="b warn" onclick="importData()">Geri yükle (mevcut verinin yerine geçer)</button></div>'
    + '<div class="btns">' + (S.demo ? '<button class="b ghost" onclick="act(\'demoStop\')">Demodan çık</button>' : '<button class="b ghost" onclick="act(\'demoStart\')">Demoyu göster (60 gün, sentetik)</button>') + "</div></div>";
  html += '<div class="card"><h2>Bu uygulama ne yapar, ne yapmaz</h2><p class="small">Garanti kazanç yoktur. iddaa her orana marj koyar; MBS bu marjı maç maç çarpar. '
    + "Uygulama yalnızca iddaa oranının, keskin piyasanın marjı arındırılmış adil oranından yüksek olduğu seçimleri önerir; böyle bir kupon yoksa pas der. "
    + "Günün kuponları birlikte tutarlandırılır (ortak Kelly); hiçbir kupon kasanın %" + num(st.maxStakeFraction * 100, 0) + "'ünü, günün toplamı %" + num(st.maxDailyExposure * 100, 0) + "'unu aşmaz.</p>"
    + '<p class="small muted">Nesine bülteni resmi bir API değildir; biçimi değişirse "Kaynakları test et" sıfır maç gösterir. Kumar kontrolünü zorlaştırmaya başladıysa YEDAM 115 ücretsiz destek verir. Sürüm ' + esc(S.version || "") + "</p></div>";
  return html;
}
var PROFILE_TEXT = {
  temkinli: "Günde en fazla 5 kupon, birlikte tutarlandırılır (ortak çeyrek Kelly); kupon başına en fazla %3, günlük toplam en fazla %9. "
    + "Demo simülasyonunda (200 ay, model hatası %2–%6) tipik ay +%1,7 ile +%2,4 (1.4 yöntemiyle +%1,1 ile +%1,4); en kötü ay −%15 ile −%25.",
  yuksek: "Günde en fazla 5 kupon, ortak yarım Kelly; kupon başına en fazla %10, günlük toplam en fazla %20. "
    + "Demo simülasyonunda tipik ay +%2,9 ile +%4,2 (1.4 yöntemiyle +%1,8 ile +%2,3); en kötü ay −%29 ile −%45. "
    + "Daha büyük bahis (¾ ya da tam Kelly) en kötü ayı −%60/−%70'e indirdi; model hatası %6 olunca tam Kelly yarım Kelly'nin gerisinde kaldı."
};
function profilesCard(st) {
  return '<div class="card"><h2>Strateji profili</h2>' + S.profiles.map(function (p) {
    var on = st.profile === p.name;
    return '<div class="prof' + (on ? " on" : "") + '"><h4>' + esc(p.title) + (on ? ' <span class="st ok">seçili</span>' : "") + "</h4>"
      + '<p class="small muted">' + esc(PROFILE_TEXT[p.name] || "") + "</p>"
      + (on || S.demo ? "" : '<div class="btns"><button class="b ghost" onclick="act(\'profile\',{name:\'' + esc(p.name) + '\'})">Bu profili kullan</button></div>') + "</div>";
  }).join("") + (st.profile === "ozel" ? '<p class="small muted">Şu an özel Kelly / üst sınır değerleri kullanılıyor.</p>' : "")
    + '<p class="small muted">Hiçbir profil kazanç garantisi vermez; ayların yaklaşık yarısı her profilde zararla kapanabilir.</p></div>';
}
function leagueName(k) {
  for (var i = 0; i < S.knownLeagues.length; i++) if (S.knownLeagues[i][0] === k) return S.knownLeagues[i][1];
  var intl = S.intlLeagues || [];
  for (var j = 0; j < intl.length; j++) if (intl[j][0] === k) return intl[j][1];
  return k;
}
function creditCard(st) {
  var p = S.creditPlan;
  var html = '<div class="card"><h2>Kredi planı</h2><label class="check"><input type="checkbox" id="sCreditAuto"' + (st.creditAuto ? " checked" : "") + ">Krediye göre otomatik daralt</label>"
    + '<label class="check"><input type="checkbox" id="sCreditExpand"' + (st.creditExpand ? " checked" : "") + ">Kredi bolsa ek lig tara</label>"
    + '<div class="two"><div><label>Kredi yenilenme günü (ayın)</label><input id="sResetDay" inputmode="numeric" value="' + st.creditResetDay + '"></div></div>';
  if (p) {
    html += '<div class="list" style="margin-top:8px">'
      + item("Kalan kredi", p.remaining != null ? String(p.remaining) + " / ayda " + p.quota : "henüz bilinmiyor")
      + item("Yenilenmeye", p.daysLeft + " gün")
      + item("Günlük bütçe / tahmini gider", "~" + num(p.budget, 1) + " / ~" + num(p.cost, 0) + " kredi")
      + item("Bugün taranan ligler", esc(p.leagues.filter(function (l) { return (p.expanded || []).indexOf(l) < 0; }).map(leagueName).join(", ")))
      + (p.expanded && p.expanded.length ? item("Kredi bol, ek ligler", esc(p.expanded.map(leagueName).join(", "))) : "")
      + item("Alt/Üst · KG · radar", (p.totals ? "açık" : "kapalı") + " · " + (p.kgEvents ? p.kgEvents + " maç" : "kapalı") + " · " + (p.radarScans ? "günde " + p.radarScans : "kapalı")
        + (p.lineupScans ? " + kadro saati" : ""))
      + item("Günlük kupon", "en fazla " + p.coupons)
      + "</div>" + (p.notes.length ? '<p class="small muted">' + esc(p.notes.join("; ")) + ".</p>" : "")
      + (p.activeKnown === false && st.oddsApiKey ? '<p class="small muted">Bugün hangi liglerin oynadığı henüz sorulmadı (ör. güncellemeden sonra): '
        + "gider her ligin %40 ihtimalle oynadığı varsayımıyla tahmin edildi ve ek lig eklenmedi. Sabahki çalışmada kendiliğinden öğrenilir.</p>"
        + '<div class="btns"><button class="b ghost" onclick="act(\'probe\')">Bugünün maçlarını sor (ücretsiz)</button></div>' : "");
  }
  return html + '<p class="small muted">Kredi, The Odds API anahtarının aylık sorgu kotasıdır (uygulamayı tek kişi kullansa da). Kredi yetmezse önce Karşılıklı Gol, sonra radar, günlük kupon 5→3, Alt/Üst, en son en az değerli fırsat çıkaran lig kısılır. '
    + "Kredi bolsa (ör. birden fazla anahtar) seçmediğin ligler de o gün taranır: bugün maçı olan, geçmişte en çok değerli seçim çıkaran önce; tahmini gider günlük bütçenin %85'ini geçmez. "
    + "Her gün gerçek kalan krediye göre yeniden hesaplanır.</p></div>";
}
function readNum(id, isPct) {
  // Türkçe yazım: "1.000" bin, "2,5" iki buçuk (Python ve Java tarafındaki parse_tl ile aynı kural)
  var raw = val(id).replace(/\s/g, "");
  if (raw.indexOf(",") >= 0) raw = raw.replace(/\./g, "").replace(",", ".");
  else if (/^\d{1,3}(\.\d{3})+$/.test(raw)) raw = raw.replace(/\./g, "");
  var n = parseFloat(raw);
  if (isNaN(n)) throw new Error("Geçersiz sayı: " + val(id));
  return isPct ? n / 100 : n;
}
function collectSettings() {
  var st = JSON.parse(JSON.stringify(S.settings));
  var keys = [];
  for (var i = 0; i < MAX_KEYS; i++) { var k = val("sKey" + i); if (k && keys.indexOf(k) < 0) keys.push(k); }
  st.oddsApiKey = keys.join("\n");
  st.leagues = Array.prototype.slice.call(document.querySelectorAll(".lg:checked")).map(function (x) { return x.value; });
  var t = val("sTime").split(":");
  st.runHour = parseInt(t[0], 10); st.runMinute = parseInt(t[1], 10);
  st.radarScans = parseInt(val("sRadar") || "0", 10);
  var lu = document.getElementById("sLineup"), qn = document.getElementById("sQuiet");
  st.lineupScans = !!(lu && lu.checked);
  st.quietNights = !!(qn && qn.checked);
  var tot = document.getElementById("sTotals");
  st.totals = !!(tot && tot.checked);
  st.kgEvents = parseInt(val("sKg") || "0", 10);
  var au = document.getElementById("sAuto"), ca = document.getElementById("sCreditAuto"), eg = document.getElementById("sEdge"), ni = document.getElementById("sIntl");
  st.autoTrack = !!(au && au.checked);
  st.internationals = !!(ni && ni.checked);
  st.edgeGuard = !!(eg && eg.checked);
  st.creditAuto = !!(ca && ca.checked);
  var ce = document.getElementById("sCreditExpand");
  st.creditExpand = !!(ce && ce.checked);
  st.creditResetDay = parseInt(val("sResetDay") || "1", 10);
  FIELDS.forEach(function (f) { st[f[0]] = readNum("f_" + f[0], f[2]); });
  st.maxLegs = Math.round(st.maxLegs);
  st.maxCouponsPerDay = Math.round(st.maxCouponsPerDay);
  return st;
}
function saveSettings() {
  try { act("saveSettings", {settings: collectSettings()}); } catch (e) { toast(e.message, true); }
}
function checkSources() {
  var out = document.getElementById("checkOut");
  var save;
  try { save = collectSettings(); } catch (e) { toast(e.message, true); return; }
  act("saveSettings", {settings: save}, true).then(function (r) {
    if (!r.ok) return;
    act("check").then(function (res) {
      var o = document.getElementById("checkOut");
      if (o) { o.style.display = "block"; o.textContent = res.message; }
    });
  });
}
function importData() {
  var data = val("sImport");
  if (!data) { toast("Önce yedek metnini yapıştır", true); return; }
  openSheet('<h3>Yedeği geri yükle</h3><p class="muted">Mevcut kasa, kupon ve ayarlar bu yedekle değiştirilecek. Emin misin?</p>'
    + '<div class="btns"><button class="b ghost" onclick="closeSheet()">Vazgeç</button><button class="b warn" id="doImport">Geri yükle</button></div>');
  document.getElementById("doImport").onclick = function () { closeSheet(); act("import", {data: data}); };
}

if (/^#(bugun|firsat|gecmis|kasa|ayarlar)$/.test(location.hash)) tab = location.hash.slice(1);
refresh();
</script>
